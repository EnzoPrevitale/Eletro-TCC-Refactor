spring:
  application:
    name: tcc-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

tcc:
  microservice:
    url: ${TCC_MICRO_URL:http://host.docker.internal:8000}
